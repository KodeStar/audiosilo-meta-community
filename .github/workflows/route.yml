name: route

# Routes an issue an AudioSilo Bridge filed through the AudioSilo GitHub App
# (BRIDGE-PLAN.md Phase 2b) into the intake bot. The routing itself - who is
# routed, the abuse bounds, the denylist, the hold, the re-run guard - is
# core's route-reusable.yml, the one copy both meta repositories call; this
# file passes this repository's two forms and its cap, then calls OUR
# intake.yml in the same run (a label applied with GITHUB_TOKEN starts no
# `labeled` run of its own). The called workflow runs on this repository's
# event, token and files (labels, comments, .github/intake-denylist), with no
# secret passed to it.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  route:
    # The called job may use at most what this job grants.
    permissions:
      contents: read
      issues: write
    # Pinned to a full core commit sha, like check.yml's and intake.yml's
    # CORE_REF and for the same reason: a core change must never change how
    # this repository routes without a pull request here that says so.
    #
    # TO BUMP: when core changes .github/workflows/route-reusable.yml, put the
    # new full 40-character sha of KodeStar/audiosilo-meta@main here in its own
    # pull request (dependabot is told to leave it alone, .github/dependabot.yml).
    uses: KodeStar/audiosilo-meta/.github/workflows/route-reusable.yml@b26ec092c315ee10b1e981a47a1a9e9210048524
    with:
      # "[characters] " and "[recaps] " are this repository's two forms.
      routes: |
        characters data:characters
        recaps data:recaps
      # Open App-filed issues one GitHub user may have here before the next is
      # held (core's cap is 25: a Bridge files a characters and a recaps issue
      # per book).
      cap: 50

  intake:
    needs: route
    if: needs.route.outputs.decision == 'route'
    # The called workflow's jobs may use at most what this job grants: the
    # intake job's own three (its rebase job never runs on an issues event).
    # intake.yml's CORE_REF pins the tooling it composes with, as always.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/intake.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      template: ${{ needs.route.outputs.label }}
    # INTAKE_PAT, so the bot's pull request triggers CI (see intake.yml), and no
    # other secret.
    secrets:
      INTAKE_PAT: ${{ secrets.INTAKE_PAT }}
